# TextMate grammars, tree-sitter grammars and the Nabi library against
# the shared corpus.
name: CI / Test the grammars and library

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    uses: nabi-lang/.github/.github/workflows/reusable-dco.yml@v1.0.3

  textmate:
    name: Test TextMate grammars
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run the TextMate tests
        run: npm run test:textmate

  # src/ parsers are generated and checked in; test them as committed.
  tree-sitter:
    name: Test tree-sitter grammars
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Run tree-sitter test on each grammar
        run: |
          for g in nabi nabion; do
            (cd tree-sitter/$g && ../../node_modules/.bin/tree-sitter test --config-path test/config.json)
          done
      - name: Run the tree-sitter corpus tests
        run: npm run test:tree-sitter

  nabi:
    name: Test the Nabi library
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nabi from the nabi.nabion pin
        uses: nabi-lang/.github/actions/install-nabi@v1.0.3
        with:
          pin: nabi.nabion
      - name: Check format with nabi fmt
        run: nabi fmt --check
      - name: Run nabi test
        run: nabi test

  # The one required check (rulesets/main.json): passes when every job
  # passed or was skipped.
  ci-gate:
    name: CI gate
    needs: [dco, textmate, tree-sitter, nabi]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *)
                echo "::error::a gate job did not pass: $r"
                exit 1
                ;;
            esac
          done
